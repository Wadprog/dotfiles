# Remove default prefix
unbind C-b
set -g prefix `
bind  ` send-prefix

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

#=== Look & feel ====
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*RGB"

# Keybindings: split
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

#Status bar
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black, bright]#S"

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=#FD9607

# Theme: status
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# Theme: status (windows) - using webvitals palette
set -g window-status-format "#[fg=#3B82F6]●"
set -g window-status-current-format "#[fg=#FD9607]●"
set -g window-status-current-style "nobold"
set -g window-status-bell-style "fg=red,nobold"

# Theme: command mode (using webvitals amber)
set -g message-style bg=default,fg=#FD9607,bright
set -g message-command-style bg=default,fg=#FD9607,bright
